[package]
name = "remotefs-ssh"
version = { workspace = true }
authors = { workspace = true }
categories = ["network-programming"]
documentation = "https://docs.rs/remotefs-ssh"
edition = { workspace = true }
include = [
  "benches/**/*",
  "examples/**/*",
  "src/**/*",
  "LICENSE",
  "README.md",
  "CHANGELOG.md",
]
keywords = ["remotefs", "ssh-client", "scp-client", "sftp-client"]
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }
rust-version = "1.95.0"
description = "remotefs SSH client library"

[features]
default = ["find", "libssh2"]
find = ["remotefs/find"]
libssh = ["dep:if-addrs", "dep:libssh-rs", "dep:socket2"]
libssh-vendored = ["libssh", "libssh-rs/vendored", "libssh-rs/vendored-openssl"]
libssh2 = [
  "dep:if-addrs",
  "dep:openssl",
  "dep:socket2",
  "dep:ssh-key",
  "dep:ssh2",
]
libssh2-vendored = ["libssh2", "openssl/vendored", "ssh2/vendored-openssl"]
no-log = ["log/max_level_off"]
russh = [
  "dep:futures-io",
  "dep:if-addrs",
  "dep:russh",
  "dep:russh-sftp",
  "dep:socket2",
  "dep:tokio",
  "remotefs/tokio",
]
with-containers = []

[dependencies]
chrono = { workspace = true }
futures-io = { workspace = true, optional = true }
if-addrs = { workspace = true, optional = true }
lazy-regex = { workspace = true }
libssh-rs = { workspace = true, optional = true }
log = { workspace = true }
openssl = { workspace = true, optional = true }
remotefs = { workspace = true }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
ssh-key = { workspace = true, optional = true }
ssh2 = { workspace = true, optional = true }
ssh2-config = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"], optional = true }

[dev-dependencies]
criterion = { workspace = true }
env_logger = { workspace = true }
pretty_assertions = { workspace = true }
rand = { workspace = true }
rpassword = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "libssh2"
harness = false
required-features = ["libssh2"]

[[bench]]
name = "libssh"
harness = false
required-features = ["libssh"]

[[bench]]
name = "russh"
harness = false
required-features = ["russh"]

[[example]]
name = "scp"
required-features = ["libssh2"]
path = "examples/scp.rs"

[[example]]
name = "scp-russh"
required-features = ["russh"]
path = "examples/scp-russh.rs"

[[example]]
name = "sftp"
required-features = ["libssh2"]
path = "examples/sftp.rs"

[[example]]
name = "sftp-russh"
required-features = ["russh"]
path = "examples/sftp-russh.rs"
