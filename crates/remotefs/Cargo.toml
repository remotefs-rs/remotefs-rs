[package]
name = "remotefs"
version = { workspace = true }
authors = { workspace = true }
categories = ["network-programming"]
documentation = "https://docs.rs/remotefs"
edition = { workspace = true }
include = [
  "src/**/*",
  "LICENSE",
  "README.md",
  "CHANGELOG.md",
  "MIGRATION.md",
  "skills/migrate-to-remotefs-1/SKILL.md",
]
keywords = [
  "scp-client",
  "sftp-client",
  "ftp-client",
  "s3-client",
  "kube-client",
]
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "a client library to work with all file transfer protocols"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
async = ["dep:async-trait", "dep:futures-io"]
default = ["find"]
# misc
find = ["dep:wildmatch"]
no-log = ["log/max_level_off"]
tokio = ["async", "dep:tokio", "dep:tokio-util"]

[dependencies]
async-trait = { workspace = true, optional = true }
futures-io = { workspace = true, optional = true }
log = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt", "sync"], optional = true }
tokio-util = { workspace = true, features = ["compat", "io-util"], optional = true }
wildmatch = { workspace = true, optional = true }

[dev-dependencies]
env_logger = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
