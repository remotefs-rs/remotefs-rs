version: "3"
services:
  samba:
    image: dperson/samba
    ports:
      - "3139:139"
      - "3445:445"
    # A volume of its own: `-p` changes the owner and mode of the share path, which
    # would lock the host user out of a bind-mounted /tmp.
    volumes:
      - share:/mnt/tmp
    command: samba.sh -u "test;test" -p -s "temp;/mnt/tmp;yes;no;yes;test;test" -w pavao
volumes:
  share:
