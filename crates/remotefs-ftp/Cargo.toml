[package]
name = "remotefs-ftp"
version = { workspace = true }
authors = { workspace = true }
categories = ["network-programming"]
documentation = "https://docs.rs/remotefs-ftp"
edition = { workspace = true }
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md"]
keywords = ["remotefs", "ftp-client"]
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "remotefs FTP client library"

[package.metadata.docs.rs]
features = ["find", "rustls-aws-lc-rs", "tokio-rustls-aws-lc-rs"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["find"]
find = ["remotefs/find"]
native-tls = ["suppaftp/native-tls"]
native-tls-vendored = ["native-tls", "suppaftp/native-tls-vendored"]
no-log = ["log/max_level_off"]
rustls-aws-lc-rs = [
  "dep:rustls-pki-types",
  "dep:webpki-roots",
  "suppaftp/rustls-aws-lc-rs",
]
rustls-ring = [
  "dep:rustls-pki-types",
  "dep:webpki-roots",
  "suppaftp/rustls-ring",
]
tokio = ["dep:futures-io", "dep:tokio", "remotefs/tokio", "suppaftp/tokio"]
tokio-native-tls = ["suppaftp/tokio-async-native-tls", "tokio"]
tokio-native-tls-vendored = [
  "suppaftp/tokio-async-native-tls-vendored",
  "tokio-native-tls",
]
tokio-rustls-aws-lc-rs = [
  "dep:rustls-pki-types",
  "dep:webpki-roots",
  "suppaftp/tokio-rustls-aws-lc-rs",
  "tokio",
]
tokio-rustls-ring = [
  "dep:rustls-pki-types",
  "dep:webpki-roots",
  "suppaftp/tokio-rustls-ring",
  "tokio",
]
with-containers = []

[dependencies]
futures-io = { workspace = true, optional = true }
log = { workspace = true }
remotefs = { workspace = true }
rustls-pki-types = { workspace = true, optional = true }
suppaftp = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"], optional = true }
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
env_logger = { workspace = true }
futures = { workspace = true }
pretty_assertions = { workspace = true }
rand = { workspace = true }
testcontainers = { workspace = true, features = ["blocking"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[target."cfg(target_os = \"windows\")"]
[target."cfg(target_os = \"windows\")".dependencies]
path-slash = { workspace = true }
