[package]
name = "remotefs-kube"
version = { workspace = true }
authors = { workspace = true }
categories = ["network-programming"]
documentation = "https://docs.rs/remotefs-kube"
edition = { workspace = true }
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md"]
keywords = ["kube-client", "kube"]
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }
rust-version = "1.89.0"
description = "remotefs implementation for kube"

[dependencies]
chrono = { workspace = true }
futures-io = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_32"] }
kube = { workspace = true, features = ["client", "config", "ws"] }
lazy-regex = { workspace = true }
log = { workspace = true }
remotefs = { workspace = true, features = ["async"] }
tokio = { workspace = true, features = ["io-util", "rt"] }

[dev-dependencies]
env_logger = { workspace = true }
futures = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_32"] }
kube = { workspace = true, features = ["client", "config", "runtime", "ws"] }
pretty_assertions = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
default = ["find"]
# misc
find = ["remotefs/find"]
no-log = ["log/max_level_off"]
tokio = ["remotefs/tokio"]
# tests
integration-tests = []

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
