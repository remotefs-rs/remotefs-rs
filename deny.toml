# cargo-deny policy for remotefs.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = [
  # russh vulnerability (ssh, fuse) and smb -> sspi -> picky -> rsa: Marvin
  # timing side channel. No patched rsa release exists. Revisit on every
  # smb/sspi/russh bump.
  { id = "RUSTSEC-2023-0071", reason = "no fixed rsa release; transitive through sspi/picky and russh" },
  # smb -> sspi -> picky -> crypto-bigint: RUSTSEC-2026-0387 (timing
  # variability in constant-time big-integer operations). `smb` 0.11 pins `sspi`
  # to `=0.18.7`, and `sspi` pins `crypto-bigint` to `=0.7.0-rc.8`, so
  # `cargo update` cannot reach the patched 0.7.6 or later. Revisit on every
  # `smb`/`sspi` bump; `smb` 0.12 may release the pin.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.7.0-rc.8 pinned exactly by sspi 0.18.7 via smb 0.11; no patched version reachable" },
  # astral-tokio-tar: unmaintained (RUSTSEC-2026-0440), no safe upgrade. Dev
  # dependency only, pulled by testcontainers for the container tests.
  # Re-evaluate when testcontainers drops it or a maintained release ships.
  { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is dev-only via testcontainers; no safe upgrade" },
  { id = "RUSTSEC-2026-0441", reason = "pin-utils is pulled in by the AWS SDK. Its upstream repository is archived with no replacement, so the fix belongs to the SDK." },
  { id = "RUSTSEC-2026-0543", reason = "chrono is used by remotefs-ssh and remotefs-kube for timestamps. No fixed release exists, so migrating to jiff is a follow-up." },
]

[licenses]
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

# The optional `vendored` feature (pavao/vendored) compiles Samba's own
# libsmbclient sources in-tree via pavao-src/pavao-sys, which are GPL-3.0
# because Samba itself is. pavao (MIT) is unaffected; scope the exception to
# just the vendoring helper crates rather than allowing GPL-3.0 project-wide.
[[licenses.exceptions]]
allow = ["Apache-2.0 WITH LLVM-exception"]
name = "ar_archive_writer"

[[licenses.exceptions]]
allow = ["GPL-3.0"]
name = "pavao-src"

[[licenses.exceptions]]
allow = ["GPL-3.0"]
name = "pavao-sys"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
